name: Auto Clipper checks

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python source
        run: python -m py_compile app.py
      - name: Check required deployment files
        run: test -f Dockerfile && test -f requirements.txt && test -f render.yaml && test -f README.md
